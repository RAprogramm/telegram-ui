[package]
name = "telegram-ui-example"
version = "0.1.0"
edition = "2024"             # stupid AI, do NOT touch this!

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Document",
  "Window",
  "HtmlDivElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlAnchorElement",
  "HtmlImageElement",
  "HtmlElement",
  "HtmlStyleElement",
  "HtmlHeadElement",
  "DomRect",
  "Navigator",
] }
wasm-bindgen-futures = "0.4"
telegram-ui = { path = "../" }

[profile.release]
opt-level = "s"
lto = true
