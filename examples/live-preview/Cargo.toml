[package]
name = "live-preview"
edition = "2024"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
telegram-ui = { path = "../.." }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document", "Window", "Element", "HtmlElement", "NodeList", "MouseEvent", 
    "HtmlHeadElement", "DomTokenList"
] }
console_error_panic_hook = "0.1"