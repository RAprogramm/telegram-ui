<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Telegram UI Yew Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
/* Telegram UI Styles - Embedded */
/* Base styles for components */

/* Button styles */
.telegram-ui-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: inherit;
  font-weight: 500;
  border: none;
  outline: none;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  transition: background-color 0.2s, color 0.2s;
}

.telegram-ui-button--ios {
  border-radius: 10px;
}

.telegram-ui-button--android {
  border-radius: 4px;
}

.telegram-ui-button--base {
  border-radius: 8px;
}

.telegram-ui-button--stretched {
  width: 100%;
}

.telegram-ui-button--loading {
  pointer-events: none;
}

.telegram-ui-button--filled {
  background-color: #0088cc;
  color: #fff;
}

.telegram-ui-button--filled:active {
  background-color: #0077b5;
}

.telegram-ui-button--bezeled {
  color: #0088cc;
}

.telegram-ui-button--bezeled:active {
  background-color: #e6f2fa;
}

.telegram-ui-button--plain {
  color: #0088cc;
}

.telegram-ui-button--plain:active {
  background-color: #e6f2fa;
}

.telegram-ui-button--gray {
  background-color: #f0f0f0;
  color: #333;
}

.telegram-ui-button--gray:active {
  background-color: #e0e0e0;
}

.telegram-ui-button--outline {
  border: 1px solid #0088cc;
  background-color: transparent;
  color: #0088cc;
}

.telegram-ui-button--outline:active {
  background-color: #e6f2fa;
}

.telegram-ui-button--white {
  background-color: #fff;
  color: #0088cc;
}

.telegram-ui-button--white:active {
  background-color: #f0f0f0;
}

.telegram-ui-button--s {
  min-width: 44px;
  height: 44px;
  padding: 0 16px;
  font-size: 15px;
}

.telegram-ui-button--m {
  min-width: 52px;
  height: 52px;
  padding: 0 24px;
  font-size: 17px;
}

.telegram-ui-button--l {
  min-width: 60px;
  height: 60px;
  padding: 0 28px;
  font-size: 19px;
}

.telegram-ui-button__content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.telegram-ui-button__before {
  display: flex;
  align-items: center;
  justify-content: center;
}

.telegram-ui-button__after {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Spinner styles */
.telegram-ui-spinner {
  border: 2px solid #e6e6e6;
  border-top-color: #0088cc;
  border-radius: 50%;
  animation: telegram-ui-spinner-rotate 1s linear infinite;
}

.telegram-ui-spinner--s {
  width: 16px;
  height: 16px;
}

.telegram-ui-spinner--m {
  width: 24px;
  height: 24px;
}

.telegram-ui-spinner--l {
  width: 32px;
  height: 32px;
}

@keyframes telegram-ui-spinner-rotate {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
