[package]
name = "telegram-ui"
edition = "2024"
version = "0.1.0"
license = "MIT"
description = "Telegram UI components for Rust - exclusively for Telegram Mini Apps"
keywords = ["telegram", "ui", "web", "wasm", "mini-apps", "webapp"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"
repository = "https://github.com/RAprogramm/telegram-ui"
documentation = "https://docs.rs/telegram-ui"
homepage = "https://github.com/RAprogramm/telegram-ui"

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Navigator",
  "Window",
  "Document",
  "HtmlElement",
  "Element",
  "Node",
  "EventTarget",
] }
leptos = { version = "0.8", optional = true }
yew = { version = "0.23", optional = true }

[features]
default = []
leptos = ["dep:leptos"]
yew = ["dep:yew"]

[dev-dependencies]
wasm-bindgen-test = { version = "0.3" }
