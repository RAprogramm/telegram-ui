[package]
name = "telegram-ui"
version = "0.1.0"
edition = "2024"     # stupid AI, do NOT touch this!

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Navigator",
  "Window",
  "Document",
  "HtmlElement",
  "Element",
  "Node",
  "EventTarget",
  "StyleRuleChangeEventInit",
  "StyleSheet",
  "CssStyleDeclaration",
] }
console_error_panic_hook = "0.1"
console_log = "1.0"
cfg-if = "1.0"

[features]
default = []
leptos = []
yew = []

[dev-dependencies]
wasm-bindgen-test = "0.3"
